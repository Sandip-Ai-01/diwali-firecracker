<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Vibes – Share the Light, Spread the Happiness!</title>
<!--
  DIWALI VIBES — single-file app (HTML + CSS + JS, zero dependencies)
  RUN:     double-click this file, or serve it:  npx serve .   /  python -m http.server
  DEPLOY:  drag & drop onto Netlify Drop, or push to GitHub and enable Pages, or upload to Vercel/Cloudflare Pages.
  NO LOGIN: a local guest profile is created automatically. Admin dashboard is open from the nav (demo only).
  DATA:    stored in this browser's localStorage (accounts, posts, images compressed to ~900px JPEG).
           To go multi-user online, replace the DB layer (load()/save()) with fetch() calls to a Flask/Node + MongoDB + Cloudinary API.
-->
<style>
:root{--bg:#120826;--bg2:#2a0f4a;--card:rgba(255,255,255,.07);--bd:rgba(255,200,100,.25);--tx:#fdf3e3;--mut:#c9b7e6;--gold:#ffd166;--sf:#ff8c1a;--rd:#ff4d6d;--glow:0 0 24px rgba(255,170,40,.35)}
[data-theme=light]{--bg:#fff6e5;--bg2:#ffe3b8;--card:rgba(255,255,255,.75);--bd:rgba(200,110,20,.3);--tx:#3b1a05;--mut:#8a5a2b;--glow:0 6px 20px rgba(200,110,20,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins','Segoe UI',system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg));background-attachment:fixed;color:var(--tx);min-height:100vh;padding-bottom:70px}
h1,h2,h3,.logo{font-family:'Georgia','Playfair Display',serif}
a{color:inherit;cursor:pointer;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1150px;margin:0 auto;padding:0 16px}
.gold{background:linear-gradient(90deg,#ffd166,#ff8c1a,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
/* nav */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-size:1.3rem;font-weight:700;white-space:nowrap}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:8px 14px;border-radius:99px;font-size:.9rem;color:var(--mut);transition:.25s}
.links a:hover,.links a.on{background:var(--card);color:var(--gold);box-shadow:var(--glow)}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;position:relative;transition:.2s}
.ic:hover{transform:scale(1.1);box-shadow:var(--glow)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-size:.65rem;border-radius:99px;padding:1px 5px}
@media(max-width:820px){.links{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:6px;z-index:60}.links a{padding:8px 10px;font-size:.78rem;text-align:center}.nav .sp{margin-left:auto}}
/* buttons / cards */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:0;border-radius:99px;padding:11px 22px;font-weight:600;background:linear-gradient(135deg,var(--gold),var(--sf));color:#3b1a05;box-shadow:var(--glow);transition:.25s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:.85rem}
.btn.danger{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
.pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,170,40,.6)}50%{box-shadow:0 0 0 16px rgba(255,170,40,0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(12px);padding:18px;position:relative}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent,var(--gold),transparent 40%,var(--sf),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
input,select,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;outline:0}
[data-theme=light] input,[data-theme=light] select,[data-theme=light] textarea{background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:var(--glow)}
select option{color:#222}
label{font-size:.82rem;color:var(--mut);display:block;margin:10px 0 4px}
.chip{display:inline-block;background:rgba(255,200,100,.15);border:1px solid var(--bd);padding:4px 12px;border-radius:99px;font-size:.78rem;cursor:pointer;transition:.2s;white-space:nowrap}
.chip.on,.chip:hover{background:linear-gradient(135deg,var(--gold),var(--sf));color:#3b1a05}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
h2.sec{font-size:1.9rem;margin:34px 0 14px}
.mut{color:var(--mut)}
/* hero */
.hero{position:relative;min-height:calc(100vh - 62px);display:grid;place-items:center;text-align:center;overflow:hidden;padding:30px 0 120px}
.hero canvas.fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .in{position:relative;z-index:3;max-width:820px;padding:0 16px}
.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.1;margin-bottom:14px;text-shadow:0 0 30px rgba(255,170,40,.5)}
.hero p.sub{font-size:clamp(1rem,2.2vw,1.3rem);color:var(--mut);margin-bottom:26px}
.lights{position:absolute;top:0;left:0;right:0;height:90px;z-index:2;pointer-events:none}
.lights i{position:absolute;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:tw 1.6s infinite alternate}
@keyframes tw{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:scale(1.15);filter:drop-shadow(0 0 8px currentColor)}}
.parts i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(40px);opacity:0}}
.rang{position:absolute;opacity:.35;animation:rot 60s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.diya{width:64px;height:30px;background:linear-gradient(#e08a3a,#8a3b0f);border-radius:0 0 64px 64px/0 0 30px 30px;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.diya::before{content:"";position:absolute;left:-8px;top:-4px;width:20px;height:10px;background:#c96a22;border-radius:50% 0 50% 50%}
.flame{position:absolute;left:50%;bottom:calc(100% - 4px);width:14px;height:28px;margin-left:-7px;background:radial-gradient(ellipse at 50% 75%,#fff 0,#ffe27a 30%,#ff8c1a 65%,transparent 72%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:fl .18s infinite alternate;transform-origin:50% 100%;filter:drop-shadow(0 0 14px #ff9d2e)}
.flame::after{content:"";position:absolute;left:-30px;top:-20px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,40,.45),transparent 70%)}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.candle{width:22px;height:74px;background:linear-gradient(90deg,#f1dcb4,#fff,#f1dcb4);border-radius:4px 4px 2px 2px;position:relative;box-shadow:0 0 30px rgba(255,170,40,.3)}
.candle .flame{bottom:calc(100% + 2px)}
.fl{position:absolute;animation:fy 5s ease-in-out infinite alternate;z-index:2}
@keyframes fy{to{transform:translateY(-18px)}}
.cd{display:flex;gap:12px;justify-content:center;margin:24px 0}
.cd div{min-width:74px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--glow)}
.cd b{display:block;font-size:1.7rem;color:var(--gold)}.cd span{font-size:.7rem;color:var(--mut)}
/* posts */
.post{padding:0;overflow:hidden;transition:.3s}.post:hover{transform:translateY(-4px);box-shadow:var(--glow)}
.post .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.post .ph a{display:flex;gap:8px;align-items:center}
.post>img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.acts{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.acts button{background:none;border:0;font-size:.95rem;padding:4px 8px;border-radius:10px;transition:.2s}
.acts button:hover{background:rgba(255,200,100,.15)}.acts button.on{color:var(--rd)}.acts .sv.on{color:var(--gold)}
.cap{padding:0 14px 10px;font-size:.9rem}.cap .tag{color:var(--gold);cursor:pointer}
.cm{padding:0 14px 12px;font-size:.84rem}.cm p{margin:3px 0}.cm form{display:flex;gap:6px;margin-top:6px}
.av{border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--sf),#c9184a);color:#fff;font-weight:700;object-fit:cover;flex:none;overflow:hidden}
.skel{height:380px;border-radius:20px;background:linear-gradient(90deg,var(--card),rgba(255,200,100,.18),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}.empty big{font-size:3rem;display:block}
/* modal / toast */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,3,25,.8);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.modal .box{background:var(--bg);border:1px solid var(--bd);border-radius:22px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;box-shadow:var(--glow)}
.modal.big .box{width:min(960px,100%)}
.x{float:right;background:none;border:0;font-size:1.4rem}
#toasts{position:fixed;top:74px;right:14px;z-index:200;display:grid;gap:8px}
.toast{background:var(--bg);border:1px solid var(--gold);border-radius:14px;padding:10px 16px;box-shadow:var(--glow);animation:ti .3s}
@keyframes ti{from{transform:translateX(40px);opacity:0}}
.pop{position:absolute;right:0;top:46px;width:310px;max-height:60vh;overflow:auto;z-index:70;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:var(--glow)}
.pop div{padding:8px;border-bottom:1px solid var(--bd);font-size:.85rem}
/* experiences */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.stage{position:relative;height:440px;border-radius:20px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(#0a0320,#2a0f4a 70%,#5b2a1a);cursor:crosshair;touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.stage .hint{position:absolute;top:10px;left:0;right:0;text-align:center;color:var(--mut);pointer-events:none;font-size:.9rem}
.sd{position:absolute;transform:translate(-50%,-100%) scale(.6);animation:pop .4s}@keyframes pop{from{transform:translate(-50%,-100%) scale(0)}}
.lan{position:absolute;bottom:-90px;width:54px;height:70px;border-radius:14px 14px 20px 20px;background:linear-gradient(#ffcf70,#ff7a18);box-shadow:0 0 30px 8px rgba(255,150,40,.6);animation:lanf linear forwards;display:grid;place-items:center;font-size:1.3rem}
.lan span{position:absolute;top:78px;width:150px;left:50%;margin-left:-75px;text-align:center;font-size:.72rem;color:#ffe9b8;text-shadow:0 0 6px #000}
@keyframes lanf{to{transform:translate(var(--dx),-560px);opacity:.1}}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.swatch.on{border-color:#fff;transform:scale(1.2)}
.quiz button.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.quiz button.ok{background:#1f8f4a;color:#fff}.quiz button.no{background:#b3283f;color:#fff}
.stat{text-align:center}.stat b{display:block;font-size:2rem;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sf))}
.badges span{display:inline-block;margin:3px;padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,rgba(255,209,102,.25),rgba(255,140,26,.25));border:1px solid var(--bd);font-size:.8rem}
.gal{position:relative;text-align:center}.gal img{max-width:100%;max-height:72vh;border-radius:14px}
.gal .nv{position:absolute;top:40%;font-size:2rem;background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:50%;width:44px;height:44px}
/* attractive upgrades */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(650px 420px at 12% 18%,rgba(255,120,30,.2),transparent),radial-gradient(750px 520px at 88% 72%,rgba(160,60,255,.25),transparent),radial-gradient(500px 360px at 60% 5%,rgba(255,209,102,.12),transparent);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:scale(1.15) translate(30px,-20px);filter:hue-rotate(25deg)}}
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none}#sky i{position:absolute;border-radius:50%;background:#ffe9b8;animation:tws infinite alternate}@keyframes tws{from{opacity:.08}to{opacity:.9}}[data-theme=light] #sky{display:none}
.gold{background-size:200% auto;animation:sh 5s linear infinite}@keyframes sh{to{background-position:200% center}}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}@keyframes shine{to{left:130%}}
.mas{column-width:290px;column-gap:18px}.mas>*{break-inside:avoid;margin-bottom:18px;display:block}
.post{animation:rs .6s backwards;border-radius:22px;overflow:hidden}@keyframes rs{from{opacity:0;transform:translateY(26px) scale(.97)}}
.post>img{transition:transform .7s}.post:hover>img{transform:scale(1.06)}.post:hover{border-color:var(--gold);box-shadow:0 12px 40px rgba(255,140,26,.28)}
.stories{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.stories a{display:grid;justify-items:center;gap:4px;flex:none;font-size:.72rem;color:var(--mut)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--gold),var(--sf),#c9184a,#7b2ff7,var(--gold));display:block;transition:.3s}.ring .av{border:3px solid var(--bg);display:grid}
.stories a:hover .ring{transform:scale(1.1) rotate(20deg)}
#fab{position:fixed;right:18px;bottom:84px;z-index:55;width:58px;height:58px;border-radius:50%;padding:0;font-size:1.5rem}
@media(min-width:821px){#fab{bottom:26px}}
header{box-shadow:0 4px 30px rgba(255,140,26,.12)}
.mohni{display:inline-block;margin:0 auto 22px;padding:14px 28px;border-radius:22px;font-size:clamp(1.2rem,3.4vw,1.9rem);font-family:Georgia,serif;background:rgba(255,200,100,.12);border:1px solid var(--gold);box-shadow:0 0 40px rgba(255,170,40,.35),inset 0 0 20px rgba(255,170,40,.1);animation:mh 2.5s ease-in-out infinite alternate}
.mohni small{display:block;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--mut);margin-top:6px}.mohni .sp{display:inline-block;animation:spk 1.2s infinite alternate}
@keyframes mh{to{transform:scale(1.04);box-shadow:0 0 60px rgba(255,170,40,.6)}}@keyframes spk{to{transform:scale(1.35) rotate(15deg)}}
.caret::after{content:"|";margin-left:2px;color:var(--gold);-webkit-text-fill-color:var(--gold);animation:bl .6s steps(1) infinite}@keyframes bl{50%{opacity:0}}
footer{text-align:center;padding:40px 16px;color:var(--mut);font-size:.85rem}
.cele{position:fixed;inset:0;z-index:150;pointer-events:none;width:100%;height:100%}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="logo gold" href="#home">🪔 Diwali Vibes</a>
  <nav class="links" id="links"></nav>
  <div class="row sp" style="margin-left:auto;gap:8px;flex-wrap:nowrap;position:relative">
    <button class="ic" id="bMusic" title="Festive music play/pause">🎵</button>
    <button class="ic" id="bTheme" title="Toggle theme">🌙</button>
    <button class="ic" id="bBell" title="Notifications">🔔</button>
    <div id="bAuth"></div>
  </div>
</div></header>
<main id="view"></main>
<footer>🪔 Diwali Vibes – Share the Light, Spread the Happiness! 🪔<br>Happy Diwali, Students! Best wishes by Sandeep Sir 🎇 · Made with love &amp; a lot of diyas · Be kind, share responsibly.</footer>
<button class="btn pulse" id="fab" onclick="A.upload()" title="Share a photo">📸</button>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ===================== UTIL ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dayKey=()=>new Date().toISOString().slice(0,10);
const dayNum=()=>Math.floor(Date.now()/864e5);
function ago(t){const s=(now()-t)/1e3;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function toast(m,ms=2800){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),ms)}
function modal(html,big){closeModal();const m=document.createElement('div');m.className='modal'+(big?' big':'');m.innerHTML=`<div class="box"><button class="x" onclick="closeModal()" aria-label="Close">✕</button>${html}</div>`;m.addEventListener('pointerdown',e=>{if(e.target===m)closeModal()});$('#modalRoot').append(m);return m}
function closeModal(){$('#modalRoot').innerHTML='';document.onkeydown=null}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dv:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let x=5381;for(const c of 'dv:'+s)x=((x<<5)+x+c.charCodeAt(0))|0;return'f'+x}}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function compress(file,max=900,q=.75){const src=await readFile(file);return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=()=>rej(new Error('Not a valid image'));i.src=src})}
const OK_TYPES=['image/jpeg','image/png','image/webp','image/gif'],MAX_MB=5;
function validImg(f){if(!f)return'Please choose an image.';if(!OK_TYPES.includes(f.type))return'Only JPG, PNG, WEBP or GIF images are allowed.';if(f.size>MAX_MB*1048576)return`Image is too large (max ${MAX_MB} MB).`;return''}
function copy(t){return navigator.clipboard?.writeText(t).then(()=>toast('Copied! 📋')).catch(()=>toast('Copy failed'))}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}

/* ===================== DB (localStorage) ===================== */
const KEY='diwaliVibes.v1';let db;
const CATS=['Home Decoration','Diwali Outfits','Rangoli Designs','Diyas & Candles','Family Celebrations','Fireworks','Sweets & Food','Office Diwali Celebration'];
const scene=(e,a,b)=>{let d='';for(let i=0;i<16;i++)d+=`<circle cx="${rnd(0,600)|0}" cy="${rnd(0,600)|0}" r="${rnd(3,22)|0}" fill="#ffd166" opacity="${rnd(.08,.4).toFixed(2)}"/>`;return'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><defs><radialGradient id="g" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs><rect width="600" height="600" fill="url(#g)"/>${d}<text x="300" y="370" font-size="230" text-anchor="middle">${e}</text></svg>`)};
async function seed(){
  const P=await sha('diwali123'),A=await sha('admin123'),t=now();

const Snd={ctx:null,sfx:localStorage.getItem('dvSfx')!=='0',music:false,timer:null,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(this.ctx?.state==='suspended')this.ctx.resume()},
  tone(f,d,type='sine',v=.08,at=0){if(!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)},
  boom(){if(!this.sfx||!this.ctx)return;const c=this.ctx,n=c.sampleRate*.5,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=700;g.gain.value=.35;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start()},
  chime(){if(this.sfx&&this.ctx){this.tone(880,.6,'sine',.06);this.tone(1320,.8,'sine',.04,.08)}},
  toggleMusic(){this.init();this.music=!this.music;$('#bMusic').textContent=this.music?'⏸️':'🎵';clearInterval(this.timer);if(this.music){const sc=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];let i=0,dir=1;this.timer=setInterval(()=>{if(Math.random()<.25)dir=-dir;i=Math.max(0,Math.min(sc.length-1,i+dir*(Math.random()<.6?1:2)));this.tone(sc[i],1.1,'triangle',.05);if(i%4===0)this.tone(sc[0]/2,2,'sine',.04)},520);toast('🎶 Festive music playing')}else toast('Music paused')}};

function Fireworks(cv,auto){
  const c=cv.getContext('2d');let W,H,P=[],R=[],iv;
  const fit=()=>{W=cv.width=cv.clientWidth||innerWidth;H=cv.height=cv.clientHeight||innerHeight};fit();
  const ro=new ResizeObserver(fit);ro.observe(cv);
  function explode(x,y,hue){Snd.boom();const n=90,ring=Math.random()<.4;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+rnd(0,.1),s=ring?4.2:rnd(.8,5);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:(hue+rnd(-30,30)+360)%360})}}
  function launch(x,y){R.push({x:x??rnd(W*.1,W*.9),y:H,ty:y??rnd(H*.12,H*.5),hue:rnd(0,360)})}
  function tick(){if(!cv.isConnected){ro.disconnect();clearInterval(iv);return}
    c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.2)';c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
    R=R.filter(r=>{r.y-=8;c.fillStyle='#ffe9a8';c.beginPath();c.arc(r.x,r.y,2.2,0,7);c.fill();if(r.y<=r.ty){explode(r.x,r.y,r.hue);return false}return true});
    P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.l-=.011;if(p.l<=0)return false;c.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;c.beginPath();c.arc(p.x,p.y,2.4*p.l+.4,0,7);c.fill();return true});
    requestAnimationFrame(tick)}
  tick();if(auto)iv=setInterval(()=>launch(),auto);
  return{launch}}

function xLantern(el){let n=0;el.innerHTML=`<div class="stage" id="ls" style="background:linear-gradient(#050118,#1b0b44 80%,#3a1a50)"><div class="hint">Release a sky lantern — each carries a message of hope</div></div><div class="row" style="margin-top:12px"><button class="btn" id="lr">🏮 Release a lantern</button><b>Released: <span id="ln" class="gold">0</span></b></div>`;
  const s=$('#ls');for(let i=0;i<50;i++){const d=document.createElement('i');d.style.cssText=`position:absolute;left:${rnd(0,100)}%;top:${rnd(0,90)}%;width:2px;height:2px;background:#fff;border-radius:50%;opacity:${rnd(.3,1)}`;s.append(d)}
  const rel=x=>{const l=document.createElement('div'),dur=rnd(9,14);l.className='lan';l.style.left=(x??rnd(8,85))+'%';l.style.setProperty('--dx',rnd(-80,80)+'px');l.style.animationDuration=dur+'s';l.innerHTML=`🔥<span>${pick(LANT)}</span>`;s.append(l);setTimeout(()=>l.remove(),dur*1e3);Snd.chime();$('#ln').textContent=++n;const u=me();if(u){u.stats.lanterns++;save();if(u.stats.lanterns%5===0)addStars(3,'for 5 lanterns')}};
  $('#lr').onclick=()=>rel();s.onpointerdown=e=>{const r=s.getBoundingClientRect();rel((e.clientX-r.left)/r.width*100-4)}}
function xFw(el){el.innerHTML=`<div class="stage" id="fs2" style="cursor:pointer"><canvas id="fwc"></canvas><div class="hint">Click or tap anywhere to launch fireworks 🎆</div></div><div class="row" style="margin-top:12px"><button class="btn ghost" id="fm">${Snd.sfx?'🔊 Sound on':'🔇 Muted'}</button><button class="btn" id="fa">🎇 Finale!</button></div>`;
  const cv=$('#fwc'),f=Fireworks(cv,0);cv.parentElement.onpointerdown=e=>{const r=cv.getBoundingClientRect();f.launch(e.clientX-r.left,e.clientY-r.top)};
  $('#fm').onclick=e=>{Snd.sfx=!Snd.sfx;localStorage.setItem('dvSfx',Snd.sfx?'1':'0');e.target.textContent=Snd.sfx?'🔊 Sound on':'🔇 Muted'};$('#fa').onclick=()=>{for(let i=0;i<9;i++)setTimeout(()=>f.launch(),i*180)}}

/* ===================== PLAY (gamification) ===================== */
const CHALL=['Light 5 diyas in Virtual Diya Lighting','Post a photo of your home decoration','Create & download a rangoli','Send a Diwali wish to 3 people','Comment kindly on 3 posts','Release 5 sky lanterns','Share a sweet recipe or photo'];
const QZ=[['Diwali is also known as the…?',['Festival of Lights','Festival of Colours','Harvest Festival'],0],['Which goddess is worshipped on Diwali?',['Saraswati','Lakshmi','Durga'],1],['Small clay lamps lit on Diwali are called?',['Diyas','Toranas','Kolams'],0],['Colourful floor art made at Diwali is called?',['Rangoli','Origami','Mehndi'],0],['Which epic tells of Rama’s return to Ayodhya?',['Mahabharata','Ramayana','Panchatantra'],1],['Diwali falls in which Hindu month (north India, amanta)?',['Kartika','Magha','Shravana'],0],['Which day of the 5-day festival is Dhanteras?',['First','Third','Last'],0],['"Bhai Dooj" celebrates the bond between…?',['Friends','Siblings','Neighbours'],1],['Diwali is celebrated in which religions?',['Hindu, Jain, Sikh & Buddhist (Newar)','Only Hindu','None'],0],['Which sweet is a Diwali favourite?',['Kaju katli','Tiramisu','Baklava'],0],['Sparkling lights strung on homes are called?',['Fairy lights','Torches','Lanterns'],0],['Which colour is considered auspicious at Diwali?',['Gold & saffron','Grey','Black'],0]];
function vPlay(el){
  const u=me(),d=dayNum(),ch=CHALL[d%CHALL.length],done=u?.chDone[dayKey()];
  const qs=[0,1,2,3,4].map(i=>QZ[(d*3+i*2)%QZ.length]);
  const lb=db.users.filter(x=>!x.banned&&x.id!=='u0').map(x=>({u:x,s:x.stars+totalLikes(x)*2+db.posts.filter(p=>p.userId===x.id).length*5})).sort((a,b)=>b.s-a.s).slice(0,10);
  const contest=cat=>db.posts.filter(p=>!p.hidden&&p.category===cat).sort((a,b)=>b.likes.length-a.likes.length).slice(0,3);
  el.innerHTML=`<div class="wrap"><h2 class="sec gold" style="margin-top:24px">🏆 Play, Compete & Collect Stars</h2>
  <div class="grid g2"><div class="card glow"><h3 class="gold">📅 Today's Challenge</h3><p style="font-size:1.15rem;margin:12px 0">${h(ch)}</p>${u?`<button class="btn" id="chb" ${done?'disabled style="opacity:.6"':''}>${done?'✅ Completed':'Mark complete (+10 ⭐)'}</button>`:`<button class="btn" onclick="authModal()">Log in to play</button>`}<p class="mut" style="font-size:.8rem;margin-top:10px">Tip: tag your post #DailyChallenge</p></div>
  <div class="card"><h3 class="gold">⭐ Your progress</h3>${u?progress(u):'<p class="mut" style="margin-top:10px">Log in to collect stars, level up and earn badges.</p>'}</div></div>
  <div class="grid g2" style="margin-top:18px"><div class="card quiz" id="qz"></div>
  <div class="card"><h3 class="gold">🥇 Community Leaderboard</h3><table style="margin-top:8px">${lb.map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td><a onclick="A.profile('${r.u.id}')" class="row" style="gap:8px">${av(r.u,28)} ${h(r.u.username)}</a></td><td class="gold">${r.s} pts</td></tr>`).join('')}</table></div></div>
  <h2 class="sec gold">🎪 Contests</h2><div class="grid g2">${['Rangoli Designs','Home Decoration'].map(c=>`<div class="card"><h3 class="gold">${c==='Rangoli Designs'?'🎨 Best Rangoli':'🏠 Best Home Decoration'}</h3>${contest(c).map((p,i)=>`<div class="row" style="margin-top:10px;cursor:pointer" onclick="A.gallery('${p.id}')"><span style="font-size:1.4rem">${['🥇','🥈','🥉'][i]}</span><img src="${p.img}" style="width:56px;height:56px;border-radius:10px;object-fit:cover"><span><b>${h(user(p.userId)?.username)}</b><br><span class="mut" style="font-size:.8rem">❤️ ${p.likes.length}</span></span></div>`).join('')||'<p class="mut">No entries yet — upload yours!</p>'}<button class="btn ghost sm" style="margin-top:14px" onclick="A.upload()">Enter contest</button></div>`).join('')}</div>
  <h2 class="sec gold">🔥 Trending</h2><div class="row">${trending().map(([t,n])=>`<span class="chip" onclick="A.tag('${t}')">${h(t)} · ${n}</span>`).join('')}</div></div>`;
  $('#chb')?.addEventListener('click',()=>{u.chDone[dayKey()]=true;u.stats.ch++;save();addStars(10,'challenge complete');vPlay(el)});
  quiz($('#qz'),qs,u)}
function progress(u){const i=lvlOf(u.stars),nx=LVL[i+1],pct=nx?(u.stars-LVL[i][0])/(nx[0]-LVL[i][0])*100:100;return`<p style="margin:10px 0"><b style="font-size:1.4rem" class="gold">${u.stars} ⭐</b> · ${LVL[i][1]}</p><div class="bar"><i style="width:${pct}%"></i></div><p class="mut" style="font-size:.8rem;margin:6px 0 12px">${nx?`${nx[0]-u.stars} stars to ${nx[1]}`:'Max level reached!'}</p><div class="badges">${badgesOf(u).map(b=>`<span>${b}</span>`).join('')||'<span class="mut">No badges yet</span>'}</div>`}
function quiz(el,qs,u){if(!u){el.innerHTML='<h3 class="gold">🧠 Daily Festive Quiz</h3><p class="mut" style="margin:12px 0">Log in to take today\'s quiz.</p><button class="btn" onclick="authModal()">Log in</button>';return}
  if(u.quizDate===dayKey()){el.innerHTML='<h3 class="gold">🧠 Daily Festive Quiz</h3><div class="empty"><big>✅</big>You\'ve completed today\'s quiz. Come back tomorrow!</div>';return}
  let i=0,sc=0;const show=()=>{if(i>=qs.length){u.quizDate=dayKey();if(sc>=3)u.stats.quiz++;save();el.innerHTML=`<h3 class="gold">🧠 Quiz complete!</h3><div class="empty"><big>${sc>=4?'🏆':'🎉'}</big>You scored ${sc}/${qs.length}</div>`;addStars(sc*5,'quiz reward');return}
    const[q,o,a]=qs[i];el.innerHTML=`<h3 class="gold">🧠 Daily Festive Quiz <span class="mut" style="font-size:.8rem">${i+1}/${qs.length}</span></h3><p style="margin:12px 0"><b>${h(q)}</b></p>${o.map((t,k)=>`<button class="opt" data-k="${k}">${h(t)}</button>`).join('')}`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('.opt',el).forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add('ok')});if(k===a)sc++;else b.classList.add('no');setTimeout(()=>{i++;show()},900)})};show()}

/* ===================== PROFILE ===================== */
let PT='posts';
function vProfile(el,id){
  const m=me(),u=id?user(id):m;if(!u){el.innerHTML=`<div class="wrap empty"><big>🪔</big><h3>Log in to see your profile</h3><br><button class="btn" onclick="authModal()">Log in / Sign up</button></div>`;return}
  const own=m?.id===u.id,ps=db.posts.filter(p=>p.userId===u.id&&(!p.hidden||own)).sort((a,b)=>b.t-a.t),sv=own?db.posts.filter(p=>u.saved.includes(p.id)&&!p.hidden):[],fol=m&&u.followers.includes(m.id);
  const tiles=l=>l.length?`<div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${l.map(p=>`<div class="card post" style="padding:0"><img src="${p.img}" style="width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in" onclick="A.gallery('${p.id}')"><div class="acts"><span>❤️ ${p.likes.length}</span><span>💬 ${p.comments.length}</span>${p.hidden?'<span class="mut">(hidden by mod)</span>':''}</div></div>`).join('')}</div>`:'<div class="empty"><big>📷</big>Nothing here yet</div>';
  el.innerHTML=`<div class="wrap"><div class="card glow" style="margin-top:24px"><div class="row" style="gap:20px">${av(u,96)}<div style="flex:1;min-width:220px"><h2 class="gold">${h(u.username)}${u.role==='admin'?' 🛡️':''}</h2><p class="mut">${h(u.bio)}</p><div class="row" style="margin-top:12px;gap:22px"><div class="stat"><b>${ps.length}</b>Posts</div><div class="stat"><b>${totalLikes(u)}</b>Likes</div><div class="stat"><b>${u.followers.length}</b>Followers</div><div class="stat"><b>${u.following.length}</b>Following</div><div class="stat"><b>${u.stars}</b>⭐</div></div></div>
  <div class="row">${own?`<button class="btn ghost sm" id="pe">✏️ Edit profile</button><button class="btn ghost sm" onclick="if(confirm('Reset all local data?')){localStorage.removeItem(KEY);location.reload()}">♻️ Reset</button>`:`<button class="btn sm" id="pf">${fol?'Following ✓':'Follow'}</button>`}</div></div>
  <p style="margin-top:14px"><b>${LVL[lvlOf(u.stars)][1]}</b></p><div class="badges">${badgesOf(u).map(b=>`<span>${b}</span>`).join('')||'<span class="mut">No badges yet</span>'}</div></div>
  <div class="tabs"><span class="chip ${PT==='posts'?'on':''}" data-pt="posts">📸 Posts</span>${own?`<span class="chip ${PT==='saved'?'on':''}" data-pt="saved">★ Favourites</span>`:''}</div><div id="pc">${tiles(PT==='saved'&&own?sv:ps)}</div></div>`;
  $$('[data-pt]').forEach(c=>c.onclick=()=>{PT=c.dataset.pt;vProfile(el,id)});
  $('#pf')?.addEventListener('click',()=>{const a=needAuth();if(!a)return;const i=u.followers.indexOf(a.id);if(i>-1){u.followers.splice(i,1);a.following=a.following.filter(x=>x!==u.id)}else{u.followers.push(a.id);a.following.push(u.id);notify(u.id,`${a.username} started following you 🙌`)}save();updateAuth();vProfile(el,id)});
  $('#pe')?.addEventListener('click',()=>{let av2=u.avatar;const mm=modal(`<h3 class="gold">Edit profile</h3><form id="ef"><label>Profile picture</label><input type="file" id="epf" accept="image/*"><label>Display name</label><input name="un" maxlength="20" value="${h(u.username)}"><label>Or emoji avatar</label><input name="em" maxlength="2" value="${u.avatar&&!u.avatar.startsWith('data:')?h(u.avatar):''}" placeholder="🪔"><label>Bio</label><textarea name="b" rows="3" maxlength="160">${h(u.bio)}</textarea><p id="ee" style="color:#ff6b81;font-size:.85rem;min-height:20px"></p><button class="btn" style="width:100%">Save</button></form>`);
    $('#epf',mm).onchange=async e=>{const f=e.target.files[0],er=validImg(f);$('#ee',mm).textContent=er;if(er)return;av2=await compress(f,200,.8)};
    $('#ef',mm).onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const nn=f.get('un').trim();if(!/^[A-Za-z0-9_ ]{3,20}$/.test(nn))return $('#ee',mm).textContent='Name: 3–20 letters or numbers.';if(db.users.some(x=>x.id!==u.id&&x.username.toLowerCase()===nn.toLowerCase()))return $('#ee',mm).textContent='That name is taken.';u.username=nn;u.bio=f.get('b').trim().slice(0,160);const em=f.get('em').trim();u.avatar=av2?.startsWith('data:')?av2:em||av2;if(save()){closeModal();updateAuth();vProfile(el,id)}}})}

/* ===================== ADMIN ===================== */
function vAdmin(el){
  const u=me();if(!u){el.innerHTML=`<div class="wrap empty"><big>🔒</big><h3>Admins only</h3><p>Log in with an admin account (demo: admin / admin123).</p></div>`;return}
  const top=db.posts.slice().sort((a,b)=>b.likes.length-a.likes.length).slice(0,5),rep=db.reports.filter(r=>!r.done);
  el.innerHTML=`<div class="wrap"><h2 class="sec gold" style="margin-top:24px">🛡️ Admin Dashboard</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[['👥',db.users.length,'Users'],['🖼️',db.posts.length,'Pictures'],['🚩',rep.length,'Open reports'],['❤️',db.posts.reduce((s,p)=>s+p.likes.length,0),'Total likes']].map(([i,n,l])=>`<div class="card stat"><span style="font-size:1.6rem">${i}</span><b>${n}</b>${l}</div>`).join('')}</div>
  <div class="grid g2" style="margin-top:18px"><div class="card"><h3 class="gold">Most liked posts</h3><table>${top.map(p=>`<tr><td><img src="${p.img}" style="width:40px;height:40px;border-radius:8px;object-fit:cover"></td><td>${h(user(p.userId)?.username)}</td><td>❤️ ${p.likes.length}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 class="gold">Trending hashtags</h3><div class="row" style="margin-top:10px">${trending().map(([t,n])=>`<span class="chip">${h(t)} · ${n}</span>`).join('')}</div></div></div>
  <div class="card" style="margin-top:18px"><h3 class="gold">🚩 Reported content</h3>${rep.length?`<table>${rep.map(r=>{const p=post(r.postId);return`<tr><td>${p?`<img src="${p.img}" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`:'(deleted)'}</td><td>${h(r.reason)}<br><span class="mut">by ${h(user(r.by)?.username)} · ${ago(r.t)}</span></td><td class="row"><button class="btn ghost sm" onclick="Ad.dismiss('${r.id}')">Dismiss</button>${p?`<button class="btn danger sm" onclick="Ad.remove('${p.id}')">Remove post</button>`:''}</td></tr>`}).join('')}</table>`:'<div class="empty">🎉 No open reports</div>'}</div>
  <div class="grid g2" style="margin-top:18px"><div class="card"><h3 class="gold">👥 User management</h3><table>${db.users.map(x=>`<tr><td>${av(x,28)}</td><td>${h(x.username)}<br><span class="mut" style="font-size:.75rem">${x.role}${x.banned?' · banned':''}</span></td><td>${x.id===u.id?'':`<button class="btn ghost sm" onclick="Ad.ban('${x.id}')">${x.banned?'Unban':'Ban'}</button> <button class="btn danger sm" onclick="Ad.delUser('${x.id}')">✕</button>`}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 class="gold">🖼️ Post moderation</h3><table>${db.posts.slice().sort((a,b)=>b.t-a.t).slice(0,12).map(p=>`<tr><td><img src="${p.img}" style="width:40px;height:40px;border-radius:8px;object-fit:cover"></td><td>${h(user(p.userId)?.username)}<br><span class="mut" style="font-size:.75rem">${p.hidden?'hidden':'visible'}</span></td><td><button class="btn ghost sm" onclick="Ad.hide('${p.id}')">${p.hidden?'Show':'Hide'}</button> <button class="btn danger sm" onclick="Ad.remove('${p.id}')">✕</button></td></tr>`).join('')}</table></div></div></div>`}
const Ad={dismiss(id){db.reports.find(r=>r.id===id).done=true;save();route()},remove(id){if(!confirm('Remove this post?'))return;const p=post(id);if(p)notify(p.userId,'A post of yours was removed by moderators.');db.posts=db.posts.filter(p=>p.id!==id);db.reports.forEach(r=>{if(r.postId===id)r.done=true});save();route()},hide(id){const p=post(id);p.hidden=!p.hidden;save();route()},ban(id){const x=user(id);x.banned=!x.banned;save();route()},delUser(id){if(!confirm('Delete user and all their posts?'))return;db.posts=db.posts.filter(p=>p.userId!==id);db.users=db.users.filter(x=>x.id!==id);save();route()}};

/* ===================== INIT ===================== */
$('#bMusic').onclick=()=>Snd.toggleMusic();
$('#bTheme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('dvTheme',t);$('#bTheme').textContent=t==='dark'?'🌙':'☀️'};
$('#bBell').onclick=e=>{e.stopPropagation();const u=me();if(!u)return authModal();const old=$('.pop');if(old)return old.remove();const l=db.notifs.filter(n=>n.to===u.id).sort((a,b)=>b.t-a.t).slice(0,15),d=document.createElement('div');d.className='pop';d.innerHTML=l.length?l.map(n=>`<div style="${n.read?'opacity:.6':''}">${h(n.text)}<br><span class="mut" style="font-size:.7rem">${ago(n.t)}</span></div>`).join(''):'<div class="mut">No notifications yet 🔔</div>';$('#bBell').parentElement.append(d);db.notifs.forEach(n=>{if(n.to===u.id)n.read=true});save();setTimeout(updateAuth,0)};
document.addEventListener('click',e=>{if(!e.target.closest('.pop'))$('.pop')?.remove()});
(async()=>{const t=localStorage.getItem('dvTheme');if(t){document.documentElement.dataset.theme=t;$('#bTheme').textContent=t==='dark'?'🌙':'☀️'}
  try{await load()}catch(e){console.error(e);toast('Could not load saved data – starting fresh');localStorage.removeItem(KEY);await load()}
  if(db.session&&(!me()||me().banned)){db.session=null}ensureGuest();updateAuth();route();sky()})();
</script>
</body>
</html>
